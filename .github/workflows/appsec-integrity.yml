
name: AppSec Trusted Integrity

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read
  statuses: write

jobs:
  verify-integrity:
    name: Verify signed Git commits

    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Siempre obtener el codigo de la base
      # confiable, NUNCA el checkout del PR.
      - name: Checkout trusted base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Solo dependencias del verificador.
      # No instalar requirements del PR.
      - name: Install verifier dependencies
        run: |
          python -m pip install "cryptography>=43,<50" "pydantic>=2,<3"

      - name: Verify PR integrity
        id: integrity
        env:
          APPSEC_PR_NUMBER: ${{ github.event.number }}
          APPSEC_PR_SHA: ${{ github.event.pull_request.head.sha }}
          APPSEC_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          APPSEC_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/ci_verify.py

      # Publicamos el estado en el SHA exacto
      # del PR, no en el SHA de master.
      - name: Publish required PR status
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          APPSEC_REPO: ${{ github.repository }}
          CHECK_OUTCOME: ${{ steps.integrity.outcome }}
          GH_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$CHECK_OUTCOME" = "success" ]; then
            state="success"
            description="Signed Git integrity verified"
          else
            state="failure"
            description="AppSec integrity verification failed"
          fi

          gh api \
            -X POST \
            "repos/$APPSEC_REPO/statuses/$PR_HEAD_SHA" \
            -f state="$state" \
            -f context="appsec-integrity/verified" \
            -f description="$description" \
            -f target_url="$GH_RUN_URL"
