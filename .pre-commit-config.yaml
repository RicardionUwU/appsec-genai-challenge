
repos:
  - repo: local
    hooks:
      - id: appsec-genai
        name: AppSec GenAI Security Scanner
        entry: python hooks/pre_commit.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
        verbose: true

      - id: appsec-genai-commit-msg
        name: AppSec GenAI Signed Commit Attestation
        entry: python hooks/commit_msg.py
        language: system
        pass_filenames: true
        always_run: true
        stages: [commit-msg]
        verbose: true
